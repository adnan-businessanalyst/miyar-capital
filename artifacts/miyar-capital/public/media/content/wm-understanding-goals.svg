<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Understanding Goals — Art Deco 3D Icon</title>
  <desc id="desc">A geometric Art Deco target and compass icon with a faceted 3D appearance, rendered in navy, slate teal, and grey on a transparent background.</desc>

  <defs>
    <linearGradient id="navyFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174F74"/>
      <stop offset="0.48" stop-color="#0C476E"/>
      <stop offset="1" stop-color="#082F4A"/>
    </linearGradient>

    <linearGradient id="tealFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5D8590"/>
      <stop offset="0.55" stop-color="#446C77"/>
      <stop offset="1" stop-color="#2E515B"/>
    </linearGradient>

    <linearGradient id="greyFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B0B0B0"/>
      <stop offset="0.5" stop-color="#898989"/>
      <stop offset="1" stop-color="#666666"/>
    </linearGradient>

    <linearGradient id="metalHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#5D8590"/>
      <stop offset="0.45" stop-color="#0C476E"/>
      <stop offset="1" stop-color="#082F4A"/>
    </radialGradient>

    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#082F4A" flood-opacity="0.28"/>
    </filter>

    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#082F4A" flood-opacity="0.28"/>
    </filter>

    <clipPath id="targetClip">
      <circle cx="256" cy="252" r="101"/>
    </clipPath>
  </defs>

  <!-- Rear Art Deco crown -->
  <g filter="url(#shadow)">
    <path d="M256 38 L286 86 L226 86 Z" fill="url(#navyFace)"/>
    <path d="M226 92 H286 L304 118 H208 Z" fill="url(#tealFace)"/>
    <path d="M196 122 H316 L334 146 H178 Z" fill="url(#greyFace)"/>
    <path d="M178 150 H334 L350 174 H162 Z" fill="url(#navyFace)"/>
  </g>

  <!-- Rear sunburst / goal rays -->
  <g opacity="0.98" filter="url(#smallShadow)">
    <path d="M256 82 L269 168 L243 168 Z" fill="url(#navyFace)"/>
    <path d="M338 104 L314 176 L294 163 Z" fill="url(#tealFace)"/>
    <path d="M401 163 L326 202 L314 179 Z" fill="url(#greyFace)"/>
    <path d="M430 250 L338 263 L338 237 Z" fill="url(#navyFace)"/>
    <path d="M401 337 L326 298 L314 321 Z" fill="url(#tealFace)"/>
    <path d="M338 400 L294 337 L314 324 Z" fill="url(#greyFace)"/>
    <path d="M256 426 L243 338 L269 338 Z" fill="url(#navyFace)"/>
    <path d="M174 400 L198 328 L218 341 Z" fill="url(#tealFace)"/>
    <path d="M111 337 L186 298 L198 321 Z" fill="url(#greyFace)"/>
    <path d="M82 250 L174 237 L174 263 Z" fill="url(#navyFace)"/>
    <path d="M111 163 L186 202 L198 179 Z" fill="url(#tealFace)"/>
    <path d="M174 104 L218 167 L198 180 Z" fill="url(#greyFace)"/>
  </g>

  <!-- Outer dimensional ring, back edge -->
  <circle cx="256" cy="264" r="144" fill="none" stroke="#082F4A" stroke-width="30" opacity="0.45"/>
  <circle cx="256" cy="252" r="144" fill="none" stroke="url(#navyFace)" stroke-width="30" filter="url(#smallShadow)"/>
  <circle cx="256" cy="252" r="122" fill="none" stroke="url(#metalHighlight)" stroke-width="5" opacity="0.75"/>

  <!-- Decorative side fins -->
  <g filter="url(#smallShadow)">
    <path d="M54 224 H146 L122 246 H42 Z" fill="url(#greyFace)"/>
    <path d="M42 252 H140 L114 274 H54 Z" fill="url(#tealFace)"/>
    <path d="M54 280 H146 L122 302 H42 Z" fill="url(#navyFace)"/>

    <path d="M458 224 H366 L390 246 H470 Z" fill="url(#greyFace)"/>
    <path d="M470 252 H372 L398 274 H458 Z" fill="url(#tealFace)"/>
    <path d="M458 280 H366 L390 302 H470 Z" fill="url(#navyFace)"/>
  </g>

  <!-- Inner target back extrusion -->
  <circle cx="256" cy="264" r="101" fill="#082F4A" opacity="0.65"/>

  <!-- Main target face -->
  <g filter="url(#smallShadow)">
    <circle cx="256" cy="252" r="101" fill="url(#navyFace)"/>
    <circle cx="256" cy="252" r="76" fill="#F7FAFC"/>
    <circle cx="256" cy="252" r="55" fill="url(#tealFace)"/>
    <circle cx="256" cy="252" r="31" fill="#F7FAFC"/>
    <circle cx="256" cy="252" r="18" fill="url(#centerGlow)"/>
  </g>

  <!-- Faceted compass needle -->
  <g filter="url(#smallShadow)">
    <path d="M256 116 L279 225 L256 214 L233 225 Z" fill="url(#navyFace)"/>
    <path d="M256 116 L256 214 L233 225 Z" fill="#174F74"/>
    <path d="M256 388 L233 279 L256 290 L279 279 Z" fill="url(#tealFace)"/>
    <path d="M256 388 L256 290 L279 279 Z" fill="#2E515B"/>

    <path d="M120 252 L229 229 L218 252 L229 275 Z" fill="url(#greyFace)"/>
    <path d="M120 252 L218 252 L229 275 Z" fill="#666666"/>
    <path d="M392 252 L283 275 L294 252 L283 229 Z" fill="url(#navyFace)"/>
    <path d="M392 252 L294 252 L283 229 Z" fill="#082F4A"/>
  </g>

  <!-- Goal focus lens / clarity facets -->
  <g clip-path="url(#targetClip)" opacity="0.95">
    <path d="M178 184 L256 252 L190 236 Z" fill="#FFFFFF" opacity="0.16"/>
    <path d="M334 184 L256 252 L322 236 Z" fill="#FFFFFF" opacity="0.10"/>
    <path d="M256 252 L206 328 L244 286 Z" fill="#000000" opacity="0.10"/>
    <path d="M256 252 L306 328 L268 286 Z" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- Center jewel -->
  <g filter="url(#smallShadow)">
    <polygon points="256,228 278,240 278,264 256,276 234,264 234,240" fill="url(#centerGlow)"/>
    <polygon points="256,228 278,240 256,252 234,240" fill="#5D8590" opacity="0.9"/>
    <polygon points="256,252 278,240 278,264 256,276" fill="#082F4A" opacity="0.85"/>
    <polygon points="256,252 234,240 234,264 256,276" fill="#0C476E"/>
  </g>

  <!-- Bottom pathway / progress motif -->
  <g filter="url(#smallShadow)">
    <path d="M206 366 H306 L332 420 H180 Z" fill="url(#navyFace)"/>
    <path d="M220 372 H292 L304 396 H208 Z" fill="#F7FAFC" opacity="0.96"/>
    <path d="M228 379 H284 L288 387 H224 Z" fill="url(#greyFace)"/>
    <path d="M218 398 H294 L300 408 H212 Z" fill="url(#tealFace)"/>
    <path d="M256 372 V409" stroke="#898989" stroke-width="5" stroke-dasharray="7 7"/>
  </g>

  <!-- Highlight accents -->
  <path d="M172 150 C206 118 306 106 350 154" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="7" stroke-linecap="round"/>
  <path d="M193 182 C222 160 291 153 321 180" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="4" stroke-linecap="round"/>

  <!-- Small Art Deco ticks -->
  <g fill="#898989">
    <rect x="252" y="94" width="8" height="18" rx="2"/>
    <rect x="252" y="392" width="8" height="18" rx="2"/>
    <rect x="96" y="248" width="18" height="8" rx="2"/>
    <rect x="398" y="248" width="18" height="8" rx="2"/>
  </g>
</svg>
