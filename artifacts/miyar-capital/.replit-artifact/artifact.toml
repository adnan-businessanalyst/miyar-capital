kind = "web"
previewPath = "/"
title = "Miyar Capital"
version = "1.0.0"
id = "artifacts/miyar-capital"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3001

[services.development]
run = "pnpm --filter @workspace/miyar-capital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miyar-capital", "run", "build" ]
run = "pnpm --filter @workspace/miyar-capital run start"

[services.env]
PORT = "3001"
BASE_PATH = "/"
