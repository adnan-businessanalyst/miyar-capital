kind = "web"
previewPath = "/"
title = "Miyar Capital"
version = "1.0.0"
id = "artifacts/miyar-capital"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20956

[services.development]
run = "pnpm --filter @workspace/miyar-capital run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miyar-capital", "run", "build" ]
publicDir = "artifacts/miyar-capital/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20956"
BASE_PATH = "/"
